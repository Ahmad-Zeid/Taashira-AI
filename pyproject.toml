[project]
name = "taashira"
version = "0.1.0"
description = "Agentic student-visa campaign planner for applicants with weak or non-standard travel documents"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
agents = [
    "google-adk>=1.0",
    "google-cloud-firestore>=2.19",
    "google-cloud-pubsub>=2.23",
    "google-cloud-storage>=2.18",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["taashira"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
